name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ORD_INDEX_WORKERS: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Restore reaction data
        uses: actions/cache@v5
        with:
          path: |
            .cache/ord
            public/reactions
          key: reactions-${{ runner.os }}-${{ hashFiles('devops/snapshots/*.txt', 'devops/scripts/build-reaction-index.ts', 'devops/scripts/ord-index-worker.ts') }}

      - name: Run checks
        run: |
          nix profile add nixpkgs#devenv
          devenv tasks run electron:check

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4

  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Generate short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore Nix store cache
        uses: actions/cache@v5
        with:
          path: nix-store.nar.gz
          key: nix-store-${{ runner.os }}-${{ hashFiles('devops/snapshots/*.txt', 'devops/scripts/build-reaction-index.ts', 'devops/scripts/ord-index-worker.ts', 'devops/nix/bun-deps.nix', 'devops/nix/reactions.nix', 'devops/nix/package.nix', 'devops/nix/docker.nix', 'devops/nix/arion-compose.nix', 'devops/nix/arion-pkgs.nix', 'flake.lock', 'bun.lockb') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
          save-always: true

      - name: Import Nix store cache
        run: |
          if [ -f nix-store.nar.gz ]; then
            bash devops/nix/nix-store-cache.sh import nix-store.nar.gz
          fi

      - name: Build Docker image with Nix
        run: nix build .#docker --print-build-logs

      - name: Load image into Docker
        run: docker load < result

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/electron-app
          docker tag "$IMAGE:latest" "$IMAGE:${{ steps.sha.outputs.short }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.sha.outputs.short }}"

      - name: Export and save Nix store cache
        run: bash devops/nix/nix-store-cache.sh export nix-store.nar.gz .#docker
