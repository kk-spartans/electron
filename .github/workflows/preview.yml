name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Restore Nix store cache
        uses: actions/cache@v5
        with:
          path: nix-store.nar.gz
          key: nix-store-${{ runner.os }}-${{ hashFiles('devops/nix/bun-deps.nix', 'devops/nix/package.nix', 'devops/nix/docker.nix', 'devops/nix/arion-compose.nix', 'devops/nix/arion-pkgs.nix', 'flake.lock', 'bun.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
          save-always: true

      - name: Import Nix store cache
        run: |
          if [ -f nix-store.nar.gz ]; then
            bash devops/nix/nix-store-cache.sh import nix-store.nar.gz
          fi

      - name: Build app
        run: |
          nix profile add nixpkgs#devenv
          devenv shell bun install
          devenv tasks run electron:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          nix build .#docker --print-build-logs
          docker load < result
          TAG="pr-${{ github.event.number }}-${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/${{ github.repository }}/electron-app:${TAG}"
          docker tag "ghcr.io/${{ github.repository }}/electron-app:latest" "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy preview to Cloudflare Pages
        if: github.event.action != 'closed'
        run: |
          devenv shell wrangler pages deployment create --project-name electron-app --branch pr-${{ github.event.number }} ./out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event.action != 'closed'
        run: |
          TAG="pr-${{ github.event.number }}-${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/${{ github.repository }}/electron-app:${TAG}"
          BODY=$(printf 'Preview ready:\n- Pages: https://pr-${{ github.event.number }}.electron-app.pages.dev\n- Docker: %s' "$IMAGE")
          devenv shell gh pr comment ${{ github.event.number }} --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
