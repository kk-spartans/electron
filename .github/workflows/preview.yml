name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Restore reaction data
        uses: actions/cache@v5
        with:
          path: |
            .cache/ord
            public/reactions
          key: reactions-${{ runner.os }}-${{ hashFiles('devops/snapshots/*.txt', 'devops/scripts/build-reaction-index.ts', 'devops/scripts/ord-index-worker.ts') }}
          restore-keys: |
            reactions-${{ runner.os }}-
          save-always: true

      - name: Restore Nix store cache
        uses: actions/cache@v5
        with:
          path: nix-store.nar.gz
          key: nix-store-${{ runner.os }}-${{ hashFiles('devops/snapshots/*.txt', 'devops/scripts/build-reaction-index.ts', 'devops/scripts/ord-index-worker.ts', 'devops/nix/bun-deps.nix', 'devops/nix/reactions.nix', 'devops/nix/package.nix', 'devops/nix/docker.nix', 'devops/nix/arion-compose.nix', 'devops/nix/arion-pkgs.nix', 'flake.lock', 'bun.lockb') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
          save-always: true

      - name: Import Nix store cache
        run: |
          if [ -f nix-store.nar.gz ]; then
            bash devops/nix/nix-store-cache.sh import nix-store.nar.gz
          fi

      - name: Build reaction data
        run: |
          nix build .#reactions --print-build-logs || true
          if [ -d result ]; then
            cp -r result/* public/reactions/
          fi

      - name: Build app
        run: |
          nix profile add nixpkgs#devenv
          devenv shell bun install
          devenv tasks run electron:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          nix build .#docker --print-build-logs
          docker load < result
          TAG="pr-${{ github.event.number }}-${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/${{ github.repository }}/electron-app:${TAG}"
          docker tag electron-app:latest "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy preview to Cloudflare Pages
        if: github.event.action != 'closed'
        run: |
          devenv shell wrangler pages project create electron-pr-${{ github.event.number }} || true
          devenv shell wrangler pages deployment create --project-name electron-pr-${{ github.event.number }} ./out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event.action != 'closed'
        run: |
          devenv shell gh pr comment ${{ github.event.number }} --body "Cloudflare Pages preview: https://electron-pr-${{ github.event.number }}.pages.dev"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete preview on PR close
        if: github.event.action == 'closed'
        run: |
          devenv shell wrangler pages project delete electron-pr-${{ github.event.number }} --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
