# SearXNG settings with its JSON API enabled.
use_default_settings:
  engines:
    remove:
      # Tor onion engines: they cannot load without Tor support and only
      # produce startup errors in this container.
      - ahmia
      - torch
      # The SPARQL init request is blocked (403) from datacenter IPs.
      - wikidata

general:
  instance_name: "electron"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

search:
  formats:
    - html
    - json

server:
  secret_key: "change-me-in-production"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
